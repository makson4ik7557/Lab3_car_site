<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div>
        <h1>Database Benchmark Dashboard</h1>
        <p>
            <a href="/dashboard/plotly/">← Back to Analytics Dashboard</a>
        </p>

        <div id="status"></div>

        <div>
            <div>
                <label for="execution_type">Execution Type</label>
                <select id="execution_type">
                    <option value="threading">Threading</option>
                    <option value="multiprocessing">Multiprocessing</option>
                </select>
            </div>

            <div>
                <label for="num_workers">Number of Workers</label>
                <input type="number" id="num_workers" value="4" min="1" max="32">
            </div>

            <div>
                <label for="num_queries">Number of Queries</label>
                <input type="number" id="num_queries" value="100" min="10" max="500">
            </div>

            <div>
                <label for="batch_size">Batch Size</label>
                <input type="number" id="batch_size" value="10" min="5" max="100">
            </div>

            <div>
                <button onclick="runBenchmark()">Run Benchmark</button>
            </div>

            <div>
                <button onclick="loadResults()">Refresh Data</button>
            </div>

            <div>
                <button onclick="clearResults()">Clear Results</button>
            </div>

            <div>
                <button onclick="createDemoData()">Create Demo Data</button>
            </div>
        </div>

        <div id="loading">
            <div></div>
            <p>Running benchmark...</p>
        </div>

        <div>
            <div>
                <div id="chart-workers"></div>
            </div>
            <div>
                <div id="chart-comparison"></div>
            </div>
            <div>
                <div id="chart-heatmap"></div>
            </div>
            <div>
                <div id="chart-resources"></div>
            </div>
        </div>
    </div>

    <script>
        let allResults = [];

        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 5000);
        }

        async function runBenchmark() {
            const executionType = document.getElementById('execution_type').value;
            const numWorkers = parseInt(document.getElementById('num_workers').value);
            const numQueries = parseInt(document.getElementById('num_queries').value);
            const batchSize = parseInt(document.getElementById('batch_size').value);

            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/repo/benchmark/run/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        execution_type: executionType,
                        num_workers: numWorkers,
                        num_queries: numQueries,
                        batch_size: batchSize
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showStatus(`Benchmark completed in ${data.execution_time.toFixed(2)}s`);
                    await loadResults();
                } else {
                    showStatus('Error: ' + data.error);
                }
            } catch (error) {
                showStatus('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function loadResults() {
            try {
                const response = await fetch('/repo/benchmark/results/');
                const data = await response.json();
                allResults = data.results;
                renderCharts();
            } catch (error) {
                showStatus('Error loading results: ' + error.message);
            }
        }

        async function createDemoData() {
            if (!confirm('Create demo benchmark data? This will run 3 tests (2, 4, 8 workers).')) {
                return;
            }

            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/repo/benchmark/demo/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });

                const data = await response.json();

                if (data.success) {
                    showStatus(`Created ${data.created_count} demo benchmarks`);
                    await loadResults();
                } else {
                    showStatus('Error: ' + data.error);
                }
            } catch (error) {
                showStatus('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function clearResults() {
            if (!confirm('Are you sure you want to clear all results?')) {
                return;
            }

            try {
                const response = await fetch('/repo/benchmark/clear/', {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });

                const data = await response.json();
                showStatus(`Cleared ${data.deleted_count} results`);
                await loadResults();
            } catch (error) {
                showStatus('Error: ' + error.message);
            }
        }

        function renderCharts() {
            if (allResults.length === 0) {
                return;
            }

            renderWorkersChart();
            renderComparisonChart();
            renderHeatmap();
            renderResourcesChart();
        }

        function renderWorkersChart() {
            const threadingData = allResults.filter(r => r.execution_type === 'threading');
            const multiprocessingData = allResults.filter(r => r.execution_type === 'multiprocessing');

            const threadingByWorkers = {};
            const multiprocessingByWorkers = {};

            threadingData.forEach(r => {
                if (!threadingByWorkers[r.num_workers]) {
                    threadingByWorkers[r.num_workers] = [];
                }
                threadingByWorkers[r.num_workers].push(r.execution_time);
            });

            multiprocessingData.forEach(r => {
                if (!multiprocessingByWorkers[r.num_workers]) {
                    multiprocessingByWorkers[r.num_workers] = [];
                }
                multiprocessingByWorkers[r.num_workers].push(r.execution_time);
            });

            const workers = [...new Set([...Object.keys(threadingByWorkers), ...Object.keys(multiprocessingByWorkers)])].sort((a, b) => a - b);

            const threadingAvg = workers.map(w => {
                const times = threadingByWorkers[w] || [];
                return times.length > 0 ? times.reduce((a, b) => a + b, 0) / times.length : null;
            });

            const multiprocessingAvg = workers.map(w => {
                const times = multiprocessingByWorkers[w] || [];
                return times.length > 0 ? times.reduce((a, b) => a + b, 0) / times.length : null;
            });

            const trace1 = {
                x: workers,
                y: threadingAvg,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Threading',
                line: {color: '#007bff'}
            };

            const trace2 = {
                x: workers,
                y: multiprocessingAvg,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Multiprocessing',
                line: {color: '#28a745'}
            };

            const layout = {
                title: 'Execution Time vs Number of Workers',
                xaxis: {title: 'Number of Workers'},
                yaxis: {title: 'Execution Time (seconds)'},
                hovermode: 'closest'
            };

            Plotly.newPlot('chart-workers', [trace1, trace2], layout);
        }

        function renderComparisonChart() {
            const threadingAvg = allResults
                .filter(r => r.execution_type === 'threading')
                .reduce((sum, r) => sum + r.execution_time, 0) /
                Math.max(1, allResults.filter(r => r.execution_type === 'threading').length);

            const multiprocessingAvg = allResults
                .filter(r => r.execution_type === 'multiprocessing')
                .reduce((sum, r) => sum + r.execution_time, 0) /
                Math.max(1, allResults.filter(r => r.execution_type === 'multiprocessing').length);

            const trace = {
                x: ['Threading', 'Multiprocessing'],
                y: [threadingAvg, multiprocessingAvg],
                type: 'bar',
                marker: {
                    color: ['#007bff', '#28a745']
                }
            };

            const layout = {
                title: 'Average Execution Time Comparison',
                yaxis: {title: 'Average Time (seconds)'}
            };

            Plotly.newPlot('chart-comparison', [trace], layout);
        }

        function renderHeatmap() {
            const workers = [...new Set(allResults.map(r => r.num_workers))].sort((a, b) => a - b);
            const batchSizes = [...new Set(allResults.map(r => r.batch_size))].sort((a, b) => a - b);

            const matrix = batchSizes.map(batch =>
                workers.map(worker => {
                    const matches = allResults.filter(r =>
                        r.num_workers === worker && r.batch_size === batch
                    );
                    if (matches.length === 0) return null;
                    return matches.reduce((sum, r) => sum + r.execution_time, 0) / matches.length;
                })
            );

            const trace = {
                z: matrix,
                x: workers,
                y: batchSizes,
                type: 'heatmap',
                colorscale: 'Viridis'
            };

            const layout = {
                title: 'Execution Time Heatmap',
                xaxis: {title: 'Number of Workers'},
                yaxis: {title: 'Batch Size'}
            };

            Plotly.newPlot('chart-heatmap', [trace], layout);
        }

        function renderResourcesChart() {
            const cpuData = allResults.map(r => r.cpu_usage).filter(v => v !== null);
            const memData = allResults.map(r => r.memory_usage).filter(v => v !== null);

            const trace1 = {
                y: cpuData,
                type: 'box',
                name: 'CPU Usage (%)',
                marker: {color: '#ff6384'}
            };

            const trace2 = {
                y: memData,
                type: 'box',
                name: 'Memory Usage (%)',
                marker: {color: '#36a2eb'}
            };

            const layout = {
                title: 'Resource Usage Distribution',
                yaxis: {title: 'Usage (%)'}
            };

            Plotly.newPlot('chart-resources', [trace1, trace2], layout);
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        loadResults();
    </script>
</body>
</html>
